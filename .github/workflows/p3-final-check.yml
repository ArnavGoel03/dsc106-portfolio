name: P3 final live regression

on:
  workflow_run:
    workflows: [pages-build-deployment, pages build and deployment]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p3-final-live-regression
  cancel-in-progress: true

jobs:
  verify-live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned test dependencies
        run: |
          npm install --global pnpm@12.18.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium --only-shell
      - name: Check source syntax and the deployed final
        run: |
          pnpm run check:p3
          pnpm run test:p3
      - name: Check the Lab 6 source and deployed Meta page
        run: |
          pnpm run check:lab6
          pnpm run test:lab6
